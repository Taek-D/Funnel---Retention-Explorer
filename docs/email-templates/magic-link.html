<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0c0f14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #00d4aa;
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .card {
      background-color: #14181f;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 32px 24px;
      margin-top: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin: 0 0 16px;
    }
    .btn {
      display: inline-block;
      background-color: #00d4aa;
      color: #0c0f14;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      margin: 8px 0 16px;
    }
    .footer {
      font-size: 11px;
      color: #475569;
      margin-top: 32px;
      text-align: center;
    }
    .footer a {
      color: #00d4aa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="{{ .SiteURL }}" class="logo">FRE Analytics</a>
    <div class="card">
      <h1>로그인 링크</h1>
      <p>아래 버튼을 클릭하여 FRE Analytics에 로그인하세요. 이 링크는 1시간 동안 유효합니다.</p>
      <a href="{{ .ConfirmationURL }}" class="btn">로그인하기</a>
      <p>버튼이 작동하지 않으면 아래 링크를 브라우저에 복사하세요:</p>
      <p style="word-break: break-all; font-size: 12px; color: #64748b;">{{ .ConfirmationURL }}</p>
      <p style="font-size: 12px; color: #64748b;">이 요청을 하지 않으셨다면 이 이메일을 무시해주세요.</p>
    </div>
    <div class="footer">
      <p>이 이메일은 FRE Analytics 로그인 요청에 의해 발송되었습니다.</p>
      <p><a href="{{ .SiteURL }}/privacy">개인정보처리방침</a> &middot; <a href="{{ .SiteURL }}/terms">이용약관</a></p>
    </div>
  </div>
</body>
</html>
